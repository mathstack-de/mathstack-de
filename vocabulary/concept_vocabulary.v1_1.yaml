# MathStack-DE concept vocabulary.
# version: v1.1_2026-07
# Release fields: stable ids, German labels, English reference translations, concept types, approved definitions, and cross-references.
LOG:
- id: LOG.01
  de: Aussagenlogik
  en: Propositional logic
  type: object
- id: LOG.02
  de: Prädikatenlogik
  en: Predicate logic
  type: object
- id: LOG.03
  de: Kombinatorische Logik
  en: Combinatorial logic
  type: object
  definition: Nur taggen, wenn kombinatorische Logik ausdrücklich Gegenstand der Aufgabe ist.
    Nicht für allgemeine Aussagenlogik oder Wahrheitstafeln — dafür LOG.01. Nicht für kombinatorisches
    Zählen — dafür PROB.13.
  see_also:
  - PROB.13
- id: LOG.04
  de: Quantoren
  en: Quantifiers
  type: object
- id: LOG.05
  de: Beweismethode
  en: Proof method
  type: method
  definition: Nur taggen, wenn die Aufgabe eine mathematische Wahrheit ÜBER die bloße Definition
    hinaus etabliert (Äquivalenz zeigen, Induktion, Widerspruch, Kontraposition, Gegenbeispiel).
    NICHT für den Nachweis einer Eigenschaft durch Einsetzen in die Definition — dafür LOG.08.
  see_also:
  - LOG.08
- id: LOG.06
  de: Logische Schlüsse
  en: Logical inference
  type: method
  definition: Taggen, wenn aus mehreren Voraussetzungen, Bedingungen oder Zwischenergebnissen
    eine neue mathematische Aussage abzuleiten oder die Gültigkeit einer Folgerung zu beurteilen
    ist. Nicht taggen für einen einzelnen routinemäßigen Rechenschritt, bloßes Einsetzen,
    algebraisches Umformen oder die direkte Anwendung einer Formel.
- id: LOG.07
  de: De-Morgan-Regeln
  en: De Morgan's laws
  type: property
- id: LOG.08
  de: Nachweis über Definition
  en: Verification via definition
  type: method
  definition: Taggen, wenn eine Eigenschaft durch direktes Prüfen/Einsetzen der Definition
    nachzuweisen ist (z.B. lokales Maximum über die Umgebungsdefinition) — kein Beweis im
    Sinne von LOG.05.
  see_also:
  - LOG.05
